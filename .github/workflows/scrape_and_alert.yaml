name: Monthly Bank Promos Scraper and Alert

on:
  schedule:
    # รอบ 00:00 UTC = 07:00 น. วันที่ 1 ของทุกเดือน (เวลาไทย)
    - cron: '0 0 1 * *'

  # ปุ่มกดรันเพื่อทดสอบได้ทันทีบนหน้าเว็บ GitHub
  workflow_dispatch:

permissions:
  contents: write

# กันไม่ให้รันซ้อนกัน (เช่น กดรันมือตอนรอบอัตโนมัติกำลังทำงาน)
concurrency:
  group: monthly-promos-scraper
  cancel-in-progress: false

jobs:
  run-monthly-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Web Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python 1_update_promos.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add promotions.db
          git diff --cached --quiet || (git commit -m "Auto-update monthly promotions [skip ci]" && git push)

      - name: Run Alert Checker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python alert_checker.py
